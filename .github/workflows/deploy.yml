name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

# 同一时刻只允许一次部署，排队不取消（避免部署到一半被打断）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # 版本从 package.json 的 packageManager 字段读取（单一事实来源）

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 项目页部署在子路径 /minecraft-web 下：basePath/assetPrefix 与前端资源 URL 均由该变量注入
      # （prebuild 会自动重跑 scripts/gen-sw-precache.mjs 生成 SW precache 清单）
      - run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /minecraft-web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - id: deployment
        uses: actions/deploy-pages@v4
